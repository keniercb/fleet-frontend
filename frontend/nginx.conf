# ============================================
# nginx.conf — Fleet Management Frontend SPA
# ============================================

server {
    listen 80;
    server_name _;

    # Root: archivos estaticos del build de Vite
    root /usr/share/nginx/html;
    index index.html;

    # ---- Seguridad: ocultar archivos ocultos (.git, .env, etc.) ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- Compresion Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- Proxy reverso al backend Spring Boot ----
    # En desarrollo Vite lo hace con server.proxy, en produccion Nginx lo maneja
    location /api/ {
        # URL del backend — configurable via variable de entorno o override
        # Cambiar por la URL real del backend en produccion
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para peticiones largas (reportes PDF, polling de pago)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # WebSocket support (por si se usa en el futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Cache de assets estaticos (JS, CSS, imagenes, fuentes) ----
    # Vite genera nombres con hash, por lo que el cache puede ser agresivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Favicon e iconos ----
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- SPA Fallback: todas las rutas a index.html ----
    # React Router maneja el enrutado client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Headers de seguridad ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Error pages: redirigir a SPA (React maneja errores 404) ----
    error_page 404 /index.html;

    # ---- Limitar tamaño de upload (si se suben archivos en el futuro) ----
    client_max_body_size 10m;
}
