  #     - SPRING_PROFILES_ACTIVE=prod
  #     - DB_URL=jdbc:postgresql://db:5432/fleet
  #   depends_on:
  #     - db
  #   restart: unless-stopped
  #   networks:
  #     - fleet-network

  # ---- Base de datos (PostgreSQL) ----
  # db:
  #   image: postgres:16-alpine
