# ============================================
# docker-compose.yml — Fleet Management Frontend
# Despliegue completo: Frontend + Backend proxy
# ============================================

services:
  # ---- Frontend (React + Vite + Nginx) ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL base de la API (en el bundle, no en runtime)
        # En produccion, /api se proxyea a traves de Nginx al backend
        VITE_API_BASE_URL: /api
    container_name: fleet-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Backend (Spring Boot) ----
